name: Portfolio checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Test database URL resolution
        run: npm run test:deployment
      - name: Lint
        run: npm run lint
      - name: Prepare an isolated presentation database
        env:
          DATABASE_URL: file:/tmp/portfolio-ci.db
        run: |
          npx prisma db push
          npm run db:sync
      - name: Build production application
        env:
          DATABASE_URL: file:/tmp/portfolio-ci.db
        run: npm run build
